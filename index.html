<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoshihito Kondoh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #fdfdfc;
    --ink: #1c1c1c;
    --sub: #6b6b6b;
    --line: #dcdad4;
    --accent: #1c1c1c;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #ffffff;
    color: var(--ink);
    font-family: "Noto Sans", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: clamp(360px, 34vw, 620px);
    aspect-ratio: 1.6 / 1;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: clamp(24px, 4vw, 44px) clamp(28px, 4.5vw, 50px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.04),
      0 12px 30px -14px rgba(0, 0, 0, 0.18),
      0 30px 60px -30px rgba(0, 0, 0, 0.15);
  }

  /* subtle paper fiber texture */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 4px;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0, transparent 40%);
    pointer-events: none;
  }

  .mark {
    font-size: clamp(9px, 1vw, 12px);
    letter-spacing: 0.35em;
    color: var(--sub);
    text-transform: uppercase;
    z-index: 1;
  }

  .rule {
    width: clamp(28px, 3vw, 40px);
    height: 2px;
    background: var(--accent);
    margin: clamp(4px, 1vw, 8px) 0 clamp(14px, 2.5vw, 26px) 0;
  }

  .names {
    z-index: 1;
  }

  .name-en {
    font-size: clamp(24px, 3.4vw, 42px);
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0 0 2px 0;
    color: var(--ink);
  }

  .name-ja {
    font-size: clamp(11px, 1.1vw, 15px);
    color: var(--sub);
    margin: 0 0 clamp(16px, 2.5vw, 28px) 0;
    letter-spacing: 0.25em;
  }

  .links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .handle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: clamp(12px, 1.2vw, 16px);
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    padding: clamp(6px, 0.8vw, 9px) clamp(12px, 1.4vw, 18px);
    border-radius: 999px;
    background: transparent;
    border: 1px solid var(--line);
    width: fit-content;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .handle:hover {
    background: rgba(0, 0, 0, 0.03);
    border-color: #b8b6b0;
  }

  .handle svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
  }

  .qr {
    position: absolute;
    top: clamp(20px, 3.2vw, 34px);
    right: clamp(20px, 3.6vw, 40px);
    width: clamp(48px, 6.5vw, 84px);
    height: clamp(48px, 6.5vw, 84px);
    z-index: 1;
  }

  .qr img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 1;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .tag {
    font-size: clamp(9px, 0.9vw, 12px);
    color: var(--sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  @media (max-width: 400px) {
    body { padding: 12px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="mark">Profile</div>
      <div class="rule"></div>
    </div>

    <div class="qr">
      <img src="assets/qr.png" alt="QR code linking to this page">
    </div>

    <div class="names">
      <p class="name-en">Yoshihito Kondoh</p>
      <p class="name-ja">近藤 義仁</p>
      <div class="links">
        <a class="handle" href="https://x.com/GOROman" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          @GOROman
        </a>
        <a class="handle" href="https://www.linkedin.com/in/goroman" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.446-2.136 2.94v5.666H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.114 20.452H3.56V9h3.554v11.452z"/></svg>
          LinkedIn
        </a>
      </div>
    </div>

    <div class="footer-row">
      <span class="tag">無職</span>
      <span class="tag">null / GOROman</span>
    </div>
  </div>
</body>
</html>
