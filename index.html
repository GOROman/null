<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoshihito Kondoh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #fdfdfc;
    --ink: #1c1c1c;
    --sub: #6b6b6b;
    --line: #dcdad4;
    --accent: #1c1c1c;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #ffffff;
    color: var(--ink);
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: "Noto Sans", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    perspective: 1400px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: clamp(360px, 34vw, 620px);
    aspect-ratio: 91 / 55;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 12px;
    padding: clamp(18px, 3vw, 28px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.04),
      0 12px 30px -14px rgba(0, 0, 0, 0.18),
      0 30px 60px -30px rgba(0, 0, 0, 0.15);
    opacity: 0;
    transform: translate3d(-160vw, -90px, 0) rotate(-38deg) rotateY(45deg);
    cursor: grab;
    touch-action: none;
    will-change: transform;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid var(--ink);
    border-radius: 8px;
    pointer-events: none;
  }

  .card.dragging {
    cursor: grabbing;
  }

  @media (max-width: 640px) {
    body {
      padding: 0;
      align-items: stretch;
    }
    .card {
      max-width: none;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      aspect-ratio: auto;
      border-radius: 0;
      border: none;
      box-shadow: none;
      padding: 28px 26px;
    }
  }

  /* subtle paper fiber texture */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0, transparent 40%);
    pointer-events: none;
  }

  .content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(12px, 3vw, 32px);
    z-index: 1;
    min-height: 0;
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.2vw, 10px);
    min-width: 0;
  }

  .name-en {
    font-size: clamp(15px, 2.4vw, 30px);
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--ink);
  }

  .name-ja {
    font-size: clamp(10px, 1vw, 13px);
    color: var(--sub);
    margin: 0 0 clamp(10px, 1.8vw, 18px) 0;
    letter-spacing: 0.25em;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.4vw, 13px);
    align-items: flex-start;
  }

  .qr-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, 0.8vw, 8px);
    flex-shrink: 0;
  }

  .qr-block img {
    width: clamp(66px, 12vw, 130px);
    height: clamp(66px, 12vw, 130px);
    display: block;
  }

  .qr-url {
    font-size: clamp(8px, 0.85vw, 11px);
    color: var(--sub);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .handle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(11px, 1.1vw, 15px);
    font-weight: 600;
    font-family: inherit;
    color: var(--ink);
    text-decoration: none;
    padding: 0;
    border-radius: 0;
    background: transparent;
    border: none;
    width: fit-content;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .handle:hover {
    opacity: 0.7;
  }

  .handle svg {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    flex-shrink: 0;
  }

  .icon-x {
    background: #000000;
    padding: 3px;
    box-sizing: border-box;
  }
  .icon-x path { fill: #ffffff; }

  .icon-linkedin {
    background: #0a66c2;
    padding: 3px;
    box-sizing: border-box;
  }
  .icon-linkedin path { fill: #ffffff; }

  .icon-facebook {
    background: #1877f2;
    border-radius: 50%;
  }
  .icon-facebook path { fill: #ffffff; }

  .qr {
    position: absolute;
    top: clamp(20px, 3.2vw, 34px);
    right: clamp(20px, 3.6vw, 40px);
    width: clamp(48px, 6.5vw, 84px);
    height: clamp(48px, 6.5vw, 84px);
    z-index: 1;
  }

  .qr img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .bottom {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2vw, 18px);
    z-index: 1;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .tag {
    font-size: clamp(9px, 0.9vw, 12px);
    color: var(--sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 20, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 10;
  }

  .overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px 28px 26px;
    width: 100%;
    max-width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.35);
    transform: translateY(6px);
    transition: transform 0.15s ease;
  }

  .overlay.open .modal {
    transform: translateY(0);
  }

  .modal-label {
    margin: 0;
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
  }

  .modal-qr {
    width: 160px;
    height: 160px;
    display: block;
  }

  .modal-link {
    font-size: 13px;
    color: var(--sub);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
    word-break: break-all;
    text-align: center;
  }

  .modal-link:hover {
    color: var(--ink);
    border-color: #b8b6b0;
  }

  .close-btn {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    font-size: 20px;
    line-height: 1;
    color: var(--sub);
    cursor: pointer;
  }

  .close-btn:hover {
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="info">
        <div>
          <p class="name-en">Yoshihito Kondoh</p>
          <p class="name-ja">近藤 義仁</p>
        </div>
        <div class="links">
          <button type="button" class="handle" data-url="https://x.com/GOROman" data-qr="assets/qr-x.png" data-label="@GOROman">
            <svg class="icon-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            @GOROman
          </button>
          <button type="button" class="handle" data-url="https://www.linkedin.com/in/goroman" data-qr="assets/qr-linkedin.png" data-label="LinkedIn">
            <svg class="icon-linkedin" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.446-2.136 2.94v5.666H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.114 20.452H3.56V9h3.554v11.452z"/></svg>
            goroman
          </button>
          <button type="button" class="handle" data-url="https://www.facebook.com/yoshihito.kondoh" data-qr="assets/qr-facebook.png" data-label="Facebook">
            <svg class="icon-facebook" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12.061C22 6.505 17.523 2 12 2S2 6.505 2 12.061c0 5.022 3.657 9.184 8.438 9.939v-7.03H7.898v-2.909h2.54V9.845c0-2.522 1.492-3.915 3.777-3.915 1.094 0 2.238.197 2.238.197v2.476h-1.26c-1.243 0-1.63.775-1.63 1.57v1.888h2.773l-.443 2.909h-2.33v7.03C18.343 21.245 22 17.083 22 12.061z"/></svg>
            yoshihito.kondoh
          </button>
        </div>
      </div>

      <div class="qr-block">
        <img src="assets/qr.png?v=2" alt="QR code linking to this page">
        <span class="qr-url">goroman.github.io/null/</span>
      </div>
    </div>

    <div class="footer-row">
      <span class="tag">無職</span>
      <span class="tag">null / GOROman</span>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalLabel">
      <button type="button" class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
      <p class="modal-label" id="modalLabel">LinkedIn</p>
      <img class="modal-qr" id="modalQr" src="" alt="QR code">
      <a class="modal-link" id="modalLink" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>

  <script>
    (function () {
      var card = document.querySelector('.card');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var HIDDEN = 'translate3d(-160vw, -90px, 0) rotate(-38deg) rotateY(45deg)';
      var PEEK   = 'translate3d(-46vw, -18px, 0) rotate(-14deg) rotateY(16deg)';
      var REST   = 'translate3d(0, 0, 0) rotate(0deg) rotateY(0deg)';

      var peeking = false;
      var settled = false;
      var holdTimer = null;

      function setTransition(t) {
        card.style.transition = t;
      }

      function onPointerNear(e) {
        if (!peeking) return;
        var x = e.clientX, y = e.clientY;
        if (x === undefined && e.touches && e.touches[0]) {
          x = e.touches[0].clientX;
          y = e.touches[0].clientY;
        }
        if (x === undefined) return;
        var r = card.getBoundingClientRect();
        var margin = 120;
        if (x > r.left - margin && x < r.right + margin && y > r.top - margin && y < r.bottom + margin) {
          retreatAndFlyIn();
        }
      }

      function retreatAndFlyIn() {
        if (!peeking) return;
        peeking = false;
        clearTimeout(holdTimer);
        window.removeEventListener('pointermove', onPointerNear);
        window.removeEventListener('touchstart', onPointerNear);

        setTransition('transform 0.28s ease-in, opacity 0.28s ease-in');
        card.style.opacity = '0.4';
        card.style.transform = HIDDEN;

        setTimeout(function () {
          setTransition('transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease-out');
          card.style.opacity = '1';
          card.style.transform = REST;
          setTimeout(function () {
            settled = true;
            enableDrag();
          }, 950);
        }, 300);
      }

      function enableDrag() {
        setTransition('none');

        var STIFFNESS = 220;
        var DAMPING = 16;
        var pos = { x: 0, y: 0 };
        var vel = { x: 0, y: 0 };
        var target = { x: 0, y: 0 };
        var dragging = false;
        var pointerId = null;
        var grabOffset = { x: 0, y: 0 };
        var raf = null;
        var lastTime = null;

        function step(ts) {
          if (lastTime === null) lastTime = ts;
          var dt = Math.min((ts - lastTime) / 1000, 0.032);
          lastTime = ts;

          var ax = -STIFFNESS * (pos.x - target.x) - DAMPING * vel.x;
          var ay = -STIFFNESS * (pos.y - target.y) - DAMPING * vel.y;
          vel.x += ax * dt;
          vel.y += ay * dt;
          pos.x += vel.x * dt;
          pos.y += vel.y * dt;

          var rot = Math.max(Math.min(pos.x / 18, 10), -10);
          card.style.transform = 'translate3d(' + pos.x.toFixed(2) + 'px,' + pos.y.toFixed(2) + 'px,0) rotate(' + rot.toFixed(2) + 'deg)';

          var atRest = !dragging &&
            Math.abs(pos.x - target.x) < 0.05 && Math.abs(pos.y - target.y) < 0.05 &&
            Math.abs(vel.x) < 0.05 && Math.abs(vel.y) < 0.05;

          if (atRest) {
            pos.x = target.x; pos.y = target.y;
            vel.x = 0; vel.y = 0;
            card.style.transform = 'translate3d(0,0,0) rotate(0deg)';
            raf = null;
            lastTime = null;
            return;
          }
          raf = requestAnimationFrame(step);
        }

        function ensureLoop() {
          if (raf === null) {
            lastTime = null;
            raf = requestAnimationFrame(step);
          }
        }

        card.addEventListener('pointerdown', function (e) {
          if (e.target.closest('button, a')) return;
          dragging = true;
          pointerId = e.pointerId;
          card.setPointerCapture(pointerId);
          card.classList.add('dragging');
          grabOffset.x = e.clientX - pos.x;
          grabOffset.y = e.clientY - pos.y;
          ensureLoop();
        });

        card.addEventListener('pointermove', function (e) {
          if (!dragging || e.pointerId !== pointerId) return;
          target.x = e.clientX - grabOffset.x;
          target.y = e.clientY - grabOffset.y;
        });

        function endDrag(e) {
          if (!dragging || e.pointerId !== pointerId) return;
          dragging = false;
          card.classList.remove('dragging');
          target.x = 0;
          target.y = 0;
          ensureLoop();
        }

        card.addEventListener('pointerup', endDrag);
        card.addEventListener('pointercancel', endDrag);
      }

      if (reduceMotion) {
        card.style.transition = 'none';
        card.style.opacity = '1';
        card.style.transform = REST;
        settled = true;
        enableDrag();
        return;
      }

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          setTransition('transform 1.8s ease-out, opacity 0.6s ease-out');
          card.style.opacity = '1';
          card.style.transform = PEEK;
          peeking = true;
          window.addEventListener('pointermove', onPointerNear);
          window.addEventListener('touchstart', onPointerNear, { passive: true });
          holdTimer = setTimeout(retreatAndFlyIn, 1800 + 2000);
        });
      });
    })();

    var overlay = document.getElementById('overlay');
    var modalQr = document.getElementById('modalQr');
    var modalLink = document.getElementById('modalLink');
    var modalLabel = document.getElementById('modalLabel');
    var closeBtn = document.getElementById('closeBtn');

    document.querySelectorAll('.handle[data-url]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var url = btn.getAttribute('data-url');
        modalLabel.textContent = btn.getAttribute('data-label');
        modalQr.src = btn.getAttribute('data-qr');
        modalLink.href = url;
        modalLink.textContent = url.replace(/^https?:\/\//, '');
        overlay.classList.add('open');
      });
    });

    function closeModal() {
      overlay.classList.remove('open');
    }
    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
