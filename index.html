<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoshihito Kondoh</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d12;
    --card-bg: #14171f;
    --card-border: #262b38;
    --text: #f4f5f7;
    --sub: #9aa3b2;
    --accent: #5eead4;
    --accent-2: #818cf8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: radial-gradient(circle at 20% 20%, #1a1f2e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1.6 / 1;
    border-radius: 20px;
    background: linear-gradient(155deg, var(--card-bg) 0%, #10131a 100%);
    border: 1px solid var(--card-border);
    box-shadow:
      0 20px 60px -20px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    overflow: hidden;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -60%;
    right: -30%;
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity: 0.15;
    filter: blur(10px);
    pointer-events: none;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background:
      linear-gradient(90deg, transparent 95%, var(--accent) 100%),
      linear-gradient(0deg, transparent 95%, var(--accent-2) 100%);
    opacity: 0.5;
    pointer-events: none;
  }

  .mark {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--sub);
    text-transform: uppercase;
    z-index: 1;
  }

  .names {
    z-index: 1;
  }

  .name-en {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0 0 6px 0;
  }

  .name-ja {
    font-size: 14px;
    color: var(--sub);
    margin: 0 0 18px 0;
  }

  .handle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--card-border);
    width: fit-content;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }

  .handle:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--accent-2);
    transform: translateY(-1px);
  }

  .handle svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 1;
  }

  .tag {
    font-size: 11px;
    color: var(--sub);
    letter-spacing: 0.05em;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px 2px var(--accent);
    display: inline-block;
    margin-right: 6px;
    vertical-align: middle;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef0f4;
      --card-bg: #ffffff;
      --card-border: #e1e4ea;
      --text: #14171f;
      --sub: #6b7280;
    }
    body {
      background: radial-gradient(circle at 20% 20%, #f5f6fa 0%, var(--bg) 55%);
    }
    .handle {
      background: rgba(0, 0, 0, 0.03);
    }
    .handle:hover {
      background: rgba(0, 0, 0, 0.06);
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><span class="dot"></span>Profile</div>

    <div class="names">
      <p class="name-en">Yoshihito Kondoh</p>
      <p class="name-ja">近藤 義仁</p>
      <a class="handle" href="https://x.com/GOROman" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @GOROman
      </a>
    </div>

    <div class="footer-row">
      <span class="tag">Engineer</span>
      <span class="tag">null / GOROman</span>
    </div>
  </div>
</body>
</html>
