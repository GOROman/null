<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoshihito Kondoh</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #fdfdfc;
    --ink: #1c1c1c;
    --sub: #6b6b6b;
    --line: #dcdad4;
    --accent: #1c1c1c;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #0a0a0a;
    color: var(--ink);
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: "Noto Sans", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    inset: 0;
    padding: 24px;
    overflow: hidden;
    perspective: 1400px;
    transform-origin: top left;
    transform: rotate(0deg) translateY(0);
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), width 0.5s cubic-bezier(0.4, 0, 0.2, 1), height 0.5s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: clamp(470px, 44vw, 810px);
    aspect-ratio: 91 / 55;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 12px;
    padding: clamp(18px, 3vw, 28px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.04),
      0 12px 30px -14px rgba(0, 0, 0, 0.18),
      0 30px 60px -30px rgba(0, 0, 0, 0.15);
    opacity: 0;
    transform: translate3d(-160vw, -90px, 0) rotate(-38deg) rotateY(45deg);
    cursor: grab;
    touch-action: none;
    will-change: transform;
    /* PC ⇄ スマホの切替 (ウィンドウ幅が 640px をまたぐ) をシームレスにモーフィングさせる。
       transform は物理演算のドラッグ/フライインで JS が直接書き換えるのでここには含めない */
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
      max-width 0.5s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.5s cubic-bezier(0.4, 0, 0.2, 1),
      border-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s cubic-bezier(0.4, 0, 0.2, 1),
      padding 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card.dragging {
    cursor: grabbing;
  }

  /* スマホ (縦持ち / 横持ち): 黒背景 (body で共通化済み) の上にカードを浮かせて画面いっぱい使う */
  @media (max-width: 640px), ((max-height: 640px) and (orientation: landscape) and (pointer: coarse)) {
    body {
      padding: 0;
      width: 100vw;
      height: 100dvh;
    }
    /* 縦持ち: body ごと 90 度回転して横長の名刺で画面いっぱい使う。
       クラスは JS が orientation を見て付け替える (横持ちとの切替は transition で滑らかに回る) */
    body.rotated {
      width: 100dvh;
      height: 100vw;
      transform: rotate(90deg) translateY(-100%);
    }
    .card {
      max-width: none;
      width: calc(100% - 28px);
      height: calc(100% - 28px);
      aspect-ratio: auto;
      border-radius: 22px;
      border-color: transparent;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.3),
        0 20px 45px -12px rgba(0, 0, 0, 0.55),
        0 40px 80px -30px rgba(0, 0, 0, 0.45);
      padding: 56px 44px;
    }
  }


  /* subtle paper fiber texture */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0, transparent 40%);
    pointer-events: none;
  }

  .content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(12px, 3vw, 32px);
    z-index: 1;
    min-height: 0;
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.2vw, 10px);
    min-width: 0;
  }

  .name-en {
    font-size: clamp(15px, 2.4vw, 30px);
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--ink);
  }

  .name-ja {
    font-size: clamp(10px, 1vw, 13px);
    color: var(--sub);
    margin: 0 0 clamp(10px, 1.8vw, 18px) 0;
    letter-spacing: 0.25em;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.4vw, 13px);
    align-items: flex-start;
  }

  .qr-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, 0.8vw, 8px);
    flex-shrink: 0;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .qr-block:hover {
    opacity: 0.7;
  }

  .qr-block img {
    width: clamp(66px, 12vw, 130px);
    height: clamp(66px, 12vw, 130px);
    display: block;
  }

  .qr-url {
    font-size: clamp(8px, 0.85vw, 11px);
    color: var(--sub);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .handle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(11px, 1.1vw, 15px);
    font-weight: 600;
    font-family: inherit;
    color: var(--ink);
    text-decoration: none;
    padding: 0;
    border-radius: 0;
    background: transparent;
    border: none;
    width: fit-content;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .handle:hover {
    opacity: 0.7;
  }

  .handle svg {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    flex-shrink: 0;
  }

  .icon-x {
    background: #000000;
    padding: 3px;
    box-sizing: border-box;
  }
  .icon-x path { fill: #ffffff; }

  .icon-linkedin {
    background: #0a66c2;
    padding: 3px;
    box-sizing: border-box;
  }
  .icon-linkedin path { fill: #ffffff; }

  .icon-facebook {
    background: #1877f2;
    border-radius: 50%;
  }
  .icon-facebook path { fill: #ffffff; }

  .qr {
    position: absolute;
    top: clamp(20px, 3.2vw, 34px);
    right: clamp(20px, 3.6vw, 40px);
    width: clamp(48px, 6.5vw, 84px);
    height: clamp(48px, 6.5vw, 84px);
    z-index: 1;
  }

  .qr img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .bottom {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2vw, 18px);
    z-index: 1;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .tag {
    font-size: clamp(9px, 0.9vw, 12px);
    color: var(--sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 20, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }

  .overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 40px 36px 32px;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.35);
    transform: scale(0.4);
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .overlay.open .modal {
    transform: scale(1);
  }

  .overlay.closing .modal {
    transform: scale(0.4);
    transition: transform 0.2s ease-in;
  }

  .modal-label {
    margin: 0;
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
  }

  .modal-qr {
    width: min(280px, 60vw);
    height: min(280px, 60vw);
    display: block;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .modal-qr:hover {
    opacity: 0.7;
  }

  .modal-link {
    font-size: 13px;
    color: var(--sub);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
    word-break: break-all;
    text-align: center;
  }

  .modal-link:hover {
    color: var(--ink);
    border-color: #b8b6b0;
  }

  .close-btn {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    font-size: 20px;
    line-height: 1;
    color: var(--sub);
    cursor: pointer;
  }

  .close-btn:hover {
    color: var(--ink);
  }

  .job-tag {
    cursor: pointer;
  }

  .egg-dot {
    position: absolute;
    top: 9px;
    left: 9px;
    width: 14px;
    height: 14px;
    cursor: default;
    z-index: 3;
  }

  .egg-toast {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translate(-50%, 12px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 50;
    pointer-events: none;
    white-space: nowrap;
  }

  .egg-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .egg-plane {
    position: fixed;
    top: 40%;
    left: -60px;
    font-size: 28px;
    z-index: 50;
    animation: egg-fly 1.8s ease-in forwards;
    pointer-events: none;
  }

  @keyframes egg-fly {
    0% { transform: translate(0, 0) rotate(-6deg); opacity: 1; }
    100% { transform: translate(120vw, -60px) rotate(8deg); opacity: 0.2; }
  }

  .egg-confetti {
    position: fixed;
    width: 6px;
    height: 6px;
    background: var(--ink);
    z-index: 50;
    pointer-events: none;
    animation: egg-confetti-burst 1.1s ease-out forwards;
  }

  @keyframes egg-confetti-burst {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; }
  }

  body.egg-invert {
    filter: invert(1);
    transition: filter 0.12s ease;
  }

  /* スマホ: vw ベースの clamp() は (特に回転時) 小さくなりすぎるので固定値で上書き。
     基本ルールより後ろに置いて確実に勝たせる。
     .content は space-between のままだと、回転後は画面の縦幅いっぱいに
     info と QR が引き離されて中央が間延びするので center + 固定 gap に変える。 */
  @media (max-width: 640px), ((max-height: 640px) and (orientation: landscape) and (pointer: coarse)) {
    .content { justify-content: center; gap: 72px; }
    .info { gap: 14px; }
    .name-en { font-size: 40px; letter-spacing: 0.005em; }
    .name-ja { font-size: 16px; margin-bottom: 22px; letter-spacing: 0.3em; }
    .links { gap: 18px; }
    .handle { font-size: 21px; gap: 14px; }
    .handle svg { width: 30px; height: 30px; border-radius: 8px; }
    .icon-x, .icon-linkedin { padding: 5px; }
    .qr-block { gap: 12px; }
    .qr-block img { width: 200px; height: 200px; }
    .qr-url { font-size: 14px; }
    .tag { font-size: 14px; letter-spacing: 0.12em; }
    .footer-row { padding-top: 20px; }
  }
</style>
</head>
<body>
  <script>
    // スマホ縦持ち判定: 最初の描画前に body.rotated を決め、回転時は付け替える
    (function () {
      var mq = window.matchMedia('(max-width: 640px) and (orientation: portrait)');
      function apply() { document.body.classList.toggle('rotated', mq.matches); }
      if (mq.addEventListener) mq.addEventListener('change', apply); else mq.addListener(apply);
      window.addEventListener('resize', apply);
      window.addEventListener('orientationchange', apply);
      apply();
    })();
  </script>
  <div class="card">
    <div class="content">
      <div class="info">
        <div>
          <p class="name-en">Yoshihito Kondoh</p>
          <p class="name-ja">近藤 義仁</p>
        </div>
        <div class="links">
          <button type="button" class="handle" data-url="https://x.com/GOROman" data-qr="assets/qr-x.png" data-label="@GOROman">
            <svg class="icon-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            @GOROman
          </button>
          <button type="button" class="handle" data-url="https://www.linkedin.com/in/goroman" data-qr="assets/qr-linkedin.png" data-label="LinkedIn">
            <svg class="icon-linkedin" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.446-2.136 2.94v5.666H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.114 20.452H3.56V9h3.554v11.452z"/></svg>
            goroman
          </button>
          <button type="button" class="handle" data-url="https://www.facebook.com/yoshihito.kondoh" data-qr="assets/qr-facebook.png" data-label="Facebook">
            <svg class="icon-facebook" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12.061C22 6.505 17.523 2 12 2S2 6.505 2 12.061c0 5.022 3.657 9.184 8.438 9.939v-7.03H7.898v-2.909h2.54V9.845c0-2.522 1.492-3.915 3.777-3.915 1.094 0 2.238.197 2.238.197v2.476h-1.26c-1.243 0-1.63.775-1.63 1.57v1.888h2.773l-.443 2.909h-2.33v7.03C18.343 21.245 22 17.083 22 12.061z"/></svg>
            yoshihito.kondoh
          </button>
        </div>
      </div>

      <a class="qr-block" href="https://goroman.github.io/null/">
        <img src="assets/qr.png?v=2" alt="QR code linking to this page">
        <span class="qr-url">goroman.github.io/null/</span>
      </a>
    </div>

    <div class="footer-row">
      <span class="tag job-tag" id="jobTag">無職</span>
      <span class="tag">null / GOROman</span>
    </div>
    <div class="egg-dot" id="eggDot" aria-hidden="true"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalLabel">
      <button type="button" class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
      <p class="modal-label" id="modalLabel">LinkedIn</p>
      <a id="modalQrLink" href="#" target="_blank" rel="noopener noreferrer"><img class="modal-qr" id="modalQr" src="" alt="QR code"></a>
      <a class="modal-link" id="modalLink" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>

  <script>
    (function () {
      var card = document.querySelector('.card');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // PC ⇄ スマホでウィンドウ幅が 640px をまたいだときの形状モーフィング用。
      // transform は下のドラッグ物理演算が毎フレーム直接書き換えるので、そこだけ 0s にして残す。
      var SIZE_TRANSITION = 'width 0.5s cubic-bezier(0.4,0,0.2,1), height 0.5s cubic-bezier(0.4,0,0.2,1), ' +
        'max-width 0.5s cubic-bezier(0.4,0,0.2,1), border-radius 0.5s cubic-bezier(0.4,0,0.2,1), ' +
        'border-color 0.5s cubic-bezier(0.4,0,0.2,1), box-shadow 0.5s cubic-bezier(0.4,0,0.2,1), ' +
        'padding 0.5s cubic-bezier(0.4,0,0.2,1)';

      // 縦持ち回転時は body が 90 度回っているので、ポインタ座標を body 座標系に変換する
      function toLocal(x, y) {
        if (document.body.classList.contains('rotated')) return { x: y, y: window.innerWidth - x };
        return { x: x, y: y };
      }
      window.__cardToLocal = toLocal;

      var HIDDEN = 'translate3d(-160vw, -90px, 0) rotate(-38deg) rotateY(45deg)';
      var PEEK   = 'translate3d(-46vw, -18px, 0) rotate(-14deg) rotateY(16deg)';
      var REST   = 'translate3d(0, 0, 0) rotate(0deg) rotateY(0deg)';

      var peeking = false;
      var settled = false;
      var holdTimer = null;

      function setTransition(t) {
        card.style.transition = t;
      }

      function onPointerNear(e) {
        if (!peeking) return;
        var x = e.clientX, y = e.clientY;
        if (x === undefined && e.touches && e.touches[0]) {
          x = e.touches[0].clientX;
          y = e.touches[0].clientY;
        }
        if (x === undefined) return;
        var r = card.getBoundingClientRect();
        var margin = 120;
        if (x > r.left - margin && x < r.right + margin && y > r.top - margin && y < r.bottom + margin) {
          retreatAndFlyIn();
        }
      }

      function retreatAndFlyIn() {
        if (!peeking) return;
        peeking = false;
        clearTimeout(holdTimer);
        window.removeEventListener('pointermove', onPointerNear);
        window.removeEventListener('touchstart', onPointerNear);

        setTransition('transform 0.28s ease-in, opacity 0.28s ease-in');
        card.style.opacity = '0.4';
        card.style.transform = HIDDEN;

        setTimeout(function () {
          setTransition('transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease-out');
          card.style.opacity = '1';
          card.style.transform = REST;
          setTimeout(function () {
            settled = true;
            enableDrag();
          }, 950);
        }, 300);
      }

      function enableDrag() {
        setTransition('transform 0s linear, ' + SIZE_TRANSITION);

        var STIFFNESS = 220;
        var DAMPING = 16;
        var pos = { x: 0, y: 0 };
        var vel = { x: 0, y: 0 };
        var target = { x: 0, y: 0 };
        var dragging = false;
        var pointerId = null;
        var grabOffset = { x: 0, y: 0 };
        var raf = null;
        var lastTime = null;

        function step(ts) {
          if (lastTime === null) lastTime = ts;
          var dt = Math.min((ts - lastTime) / 1000, 0.032);
          lastTime = ts;

          var ax = -STIFFNESS * (pos.x - target.x) - DAMPING * vel.x;
          var ay = -STIFFNESS * (pos.y - target.y) - DAMPING * vel.y;
          vel.x += ax * dt;
          vel.y += ay * dt;
          pos.x += vel.x * dt;
          pos.y += vel.y * dt;

          var rot = Math.max(Math.min(pos.x / 18, 10), -10);
          card.style.transform = 'translate3d(' + pos.x.toFixed(2) + 'px,' + pos.y.toFixed(2) + 'px,0) rotate(' + rot.toFixed(2) + 'deg)';

          var atRest = !dragging &&
            Math.abs(pos.x - target.x) < 0.05 && Math.abs(pos.y - target.y) < 0.05 &&
            Math.abs(vel.x) < 0.05 && Math.abs(vel.y) < 0.05;

          if (atRest) {
            pos.x = target.x; pos.y = target.y;
            vel.x = 0; vel.y = 0;
            card.style.transform = 'translate3d(0,0,0) rotate(0deg)';
            raf = null;
            lastTime = null;
            return;
          }
          raf = requestAnimationFrame(step);
        }

        function ensureLoop() {
          if (raf === null) {
            lastTime = null;
            raf = requestAnimationFrame(step);
          }
        }

        card.addEventListener('pointerdown', function (e) {
          if (e.target.closest('button, a, .job-tag, .egg-dot')) return;
          dragging = true;
          pointerId = e.pointerId;
          card.setPointerCapture(pointerId);
          card.classList.add('dragging');
          var p = toLocal(e.clientX, e.clientY);
          grabOffset.x = p.x - pos.x;
          grabOffset.y = p.y - pos.y;
          ensureLoop();
        });

        card.addEventListener('pointermove', function (e) {
          if (!dragging || e.pointerId !== pointerId) return;
          var p = toLocal(e.clientX, e.clientY);
          target.x = p.x - grabOffset.x;
          target.y = p.y - grabOffset.y;
        });

        function endDrag(e) {
          if (!dragging || e.pointerId !== pointerId) return;
          dragging = false;
          card.classList.remove('dragging');
          target.x = 0;
          target.y = 0;
          ensureLoop();
        }

        card.addEventListener('pointerup', endDrag);
        card.addEventListener('pointercancel', endDrag);
      }

      if (reduceMotion) {
        card.style.transition = 'none';
        card.style.opacity = '1';
        card.style.transform = REST;
        settled = true;
        enableDrag();
        return;
      }

      // スマホでは覗き見演出を省き、その場でフェードイン
      var isPhone = window.matchMedia('(max-width: 640px), ((max-height: 640px) and (orientation: landscape) and (pointer: coarse))').matches;
      if (isPhone) {
        setTransition('none');
        card.style.transform = REST;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            setTransition('opacity 0.6s ease-out');
            card.style.opacity = '1';
            setTimeout(function () {
              settled = true;
              enableDrag();
            }, 650);
          });
        });
        return;
      }

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          setTransition('transform 1.8s ease-out, opacity 0.6s ease-out');
          card.style.opacity = '1';
          card.style.transform = PEEK;
          peeking = true;
          window.addEventListener('pointermove', onPointerNear);
          window.addEventListener('touchstart', onPointerNear, { passive: true });
          holdTimer = setTimeout(retreatAndFlyIn, 1800 + 2000);
        });
      });
    })();

    // アクセス記録: worker/ の Cloudflare Worker に時刻・referrer などを送る (IP とジオIP は Worker 側で付く)。
    // 空文字のままなら何も送らない。
    var ACCESS_LOG_ENDPOINT = '';
    (function () {
      if (!ACCESS_LOG_ENDPOINT) return;
      try {
        var params = new URLSearchParams(location.search);
        var payload = JSON.stringify({
          t: new Date().toISOString(),
          ref: document.referrer || '',
          lang: navigator.language || '',
          screen: screen.width + 'x' + screen.height,
          src: params.get('s') || ''
        });
        // text/plain にすると CORS の preflight が要らない
        var blob = new Blob([payload], { type: 'text/plain' });
        if (!(navigator.sendBeacon && navigator.sendBeacon(ACCESS_LOG_ENDPOINT, blob))) {
          fetch(ACCESS_LOG_ENDPOINT, { method: 'POST', body: blob, keepalive: true, mode: 'cors' }).catch(function () {});
        }
      } catch (e) {}
    })();

    var overlay = document.getElementById('overlay');
    var modalQr = document.getElementById('modalQr');
    var modalLink = document.getElementById('modalLink');
    var modalQrLink = document.getElementById('modalQrLink');
    var modalLabel = document.getElementById('modalLabel');
    var closeBtn = document.getElementById('closeBtn');

    document.querySelectorAll('.handle[data-url]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var url = btn.getAttribute('data-url');
        modalLabel.textContent = btn.getAttribute('data-label');
        modalQr.src = btn.getAttribute('data-qr');
        modalLink.href = url;
        modalQrLink.href = url;
        modalLink.textContent = url.replace(/^https?:\/\//, '');
        overlay.classList.remove('closing');
        overlay.classList.add('open');
      });
    });

    function closeModal() {
      if (!overlay.classList.contains('open')) return;
      overlay.classList.add('closing');
      overlay.classList.remove('open');
      setTimeout(function () {
        overlay.classList.remove('closing');
      }, 220);
    }
    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });

    (function () {
      var card = document.querySelector('.card');
      var jobTag = document.getElementById('jobTag');
      var eggDot = document.getElementById('eggDot');

      console.log('%c GOROman.card ', 'font-size:14px;font-weight:bold;background:#1c1c1c;color:#fdfdfc;padding:4px 8px;border-radius:4px;');
      console.log('%c無職だけど元気です。ソースは自由に読んでね。', 'color:#6b6b6b;');
      console.log('%cヒント: コナミコマンドか "gorogoro" と打ってみて。', 'color:#6b6b6b;');

      function toast(text, ms) {
        var el = document.createElement('div');
        el.className = 'egg-toast';
        el.textContent = text;
        document.body.appendChild(el);
        requestAnimationFrame(function () { el.classList.add('show'); });
        setTimeout(function () {
          el.classList.remove('show');
          setTimeout(function () { el.remove(); }, 300);
        }, ms || 1600);
      }

      // 1. 無職タグをクリックすると肩書きがループする
      var jobs = ['無職', 'エンジニア(自称)', '世界のGOROman', '休養中'];
      var jobIdx = 0;
      if (jobTag) {
        jobTag.addEventListener('click', function (e) {
          e.stopPropagation();
          jobIdx = (jobIdx + 1) % jobs.length;
          jobTag.textContent = jobs[jobIdx];
        });
      }

      // 2. タブを離れると title が変わる
      var originalTitle = document.title;
      document.addEventListener('visibilitychange', function () {
        document.title = document.hidden ? '👋 戻ってきて…' : originalTitle;
      });

      // 3. 右クリックにひとこと
      card.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        toast('コピーはできないよ🙊');
      });

      // 4. 長押しすると捕まる
      var pressTimer = null;
      var pressMoved = false;
      card.addEventListener('pointerdown', function (e) {
        if (e.target.closest('button, a, .job-tag, .egg-dot')) return;
        pressMoved = false;
        pressTimer = setTimeout(function () {
          if (!pressMoved) toast('掴まえた! 🖐️');
        }, 1200);
      });
      card.addEventListener('pointermove', function () { pressMoved = true; });
      ['pointerup', 'pointercancel'].forEach(function (ev) {
        card.addEventListener(ev, function () { clearTimeout(pressTimer); });
      });

      // 5. ダブルクリックで紙飛行機
      card.addEventListener('dblclick', function (e) {
        if (e.target.closest('button, a, .job-tag, .egg-dot')) return;
        var plane = document.createElement('div');
        plane.className = 'egg-plane';
        plane.textContent = '✈️';
        document.body.appendChild(plane);
        setTimeout(function () { plane.remove(); }, 1800);
      });

      // 6. 合言葉 "gorogoro" でカードがゴロゴロ震える
      var typedBuffer = '';
      window.addEventListener('keydown', function (e) {
        if (e.key.length !== 1) return;
        typedBuffer = (typedBuffer + e.key).slice(-20).toLowerCase();
        if (typedBuffer.indexOf('gorogoro') !== -1) {
          typedBuffer = '';
          card.animate([
            { transform: 'rotate(0deg)' },
            { transform: 'rotate(-4deg)' },
            { transform: 'rotate(4deg)' },
            { transform: 'rotate(-3deg)' },
            { transform: 'rotate(3deg)' },
            { transform: 'rotate(0deg)' }
          ], { duration: 400, easing: 'ease-in-out' });
          toast('ゴロゴロ...🐾');
        }
      });

      // 7. コナミコマンドでパーティーモード
      var KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
      var kIdx = 0;
      window.addEventListener('keydown', function (e) {
        var key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        if (key === KONAMI[kIdx]) {
          kIdx++;
          if (kIdx === KONAMI.length) {
            kIdx = 0;
            partyMode();
          }
        } else {
          kIdx = (key === KONAMI[0]) ? 1 : 0;
        }
      });

      function partyMode() {
        card.animate([
          { transform: 'rotate(0deg) scale(1)' },
          { transform: 'rotate(360deg) scale(1.05)' },
          { transform: 'rotate(720deg) scale(1)' }
        ], { duration: 900, easing: 'ease-in-out' });
        confettiBurst();
        toast('🎉 GOROman MODE 🎉', 2000);
      }

      function confettiBurst() {
        var rect = card.getBoundingClientRect();
        var center = window.__cardToLocal(rect.left + rect.width / 2, rect.top + rect.height / 2);
        for (var i = 0; i < 24; i++) {
          (function () {
            var p = document.createElement('div');
            p.className = 'egg-confetti';
            p.style.left = center.x + 'px';
            p.style.top = center.y + 'px';
            var angle = Math.random() * Math.PI * 2;
            var dist = 120 + Math.random() * 160;
            p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
            p.style.setProperty('--dy', (Math.sin(angle) * dist - 40) + 'px');
            p.style.animationDelay = (Math.random() * 0.15) + 's';
            document.body.appendChild(p);
            setTimeout(function () { p.remove(); }, 1500);
          })();
        }
      }

      // 8. 放置しているとカードがふわっと呼吸する
      var idleTimer = null;
      function resetIdle() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function () {
          card.animate([
            { transform: 'translateY(0)' },
            { transform: 'translateY(-6px)' },
            { transform: 'translateY(0)' }
          ], { duration: 900, easing: 'ease-in-out' });
          resetIdle();
        }, 20000);
      }
      ['pointerdown', 'pointermove', 'keydown', 'scroll'].forEach(function (ev) {
        window.addEventListener(ev, resetIdle, { passive: true });
      });
      resetIdle();

      // 9. 隠しドット (枠の左上) を見つけてクリックすると一瞬白黒反転
      if (eggDot) {
        eggDot.addEventListener('click', function (e) {
          e.stopPropagation();
          document.body.classList.add('egg-invert');
          toast('見つけた! 👀', 1200);
          setTimeout(function () { document.body.classList.remove('egg-invert'); }, 900);
        });
      }
    })();
  </script>
</body>
</html>
