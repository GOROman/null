<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoshihito Kondoh</title>
<style>
  :root {
    color-scheme: light;
    --paper: #fdfdfc;
    --ink: #1c1c1c;
    --sub: #6b6b6b;
    --line: #dcdad4;
    --accent: #1c1c1c;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #ffffff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 440px;
    aspect-ratio: 1.6 / 1;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px 36px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.04),
      0 12px 30px -14px rgba(0, 0, 0, 0.18),
      0 30px 60px -30px rgba(0, 0, 0, 0.15);
  }

  /* subtle paper fiber texture */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 4px;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0, transparent 40%);
    pointer-events: none;
  }

  .mark {
    font-size: 10px;
    letter-spacing: 0.35em;
    color: var(--sub);
    text-transform: uppercase;
    z-index: 1;
  }

  .rule {
    width: 32px;
    height: 2px;
    background: var(--accent);
    margin: 6px 0 20px 0;
  }

  .names {
    z-index: 1;
  }

  .name-en {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0 0 4px 0;
    color: var(--ink);
  }

  .name-ja {
    font-size: 13px;
    color: var(--sub);
    margin: 0 0 20px 0;
    letter-spacing: 0.05em;
  }

  .handle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 999px;
    background: transparent;
    border: 1px solid var(--line);
    width: fit-content;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .handle:hover {
    background: rgba(0, 0, 0, 0.03);
    border-color: #b8b6b0;
  }

  .handle svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 1;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .tag {
    font-size: 10px;
    color: var(--sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="mark">Profile</div>
      <div class="rule"></div>
    </div>

    <div class="names">
      <p class="name-en">Yoshihito Kondoh</p>
      <p class="name-ja">近藤 義仁</p>
      <a class="handle" href="https://x.com/GOROman" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @GOROman
      </a>
    </div>

    <div class="footer-row">
      <span class="tag">無職</span>
      <span class="tag">null / GOROman</span>
    </div>
  </div>
</body>
</html>
